<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YACUGO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- PANTALLA DE CARGA (SOLO LOGO) -->
<div id="splashScreen" class="screen active">
    <div class="splash-content">
        <img src="logo.png" alt="Mi Logo" class="splash-logo">
    </div>
</div>

<!-- PANTALLA PRINCIPAL -->
<div id="mainScreen" class="screen">
    
    <!-- NUEVO ENCABEZADO ESTILO APP -->
    <div class="app-header">
        <div class="header-logo">
            <i class="fas fa-bus"></i>
        </div>
        <div class="header-text">
            <h1>YACUGO</h1>
            <p>Tu transporte en Yacuiba</p>
        </div>
        <div class="header-actions">
            <i class="fas fa-bell"></i>
        </div>
    </div>

    <div id="mapMain"></div>
    <button id="btnUbicarme" class="btn-ubicarme" onclick="ubicarme()"><i class="fas fa-crosshairs"></i></button>
    
    <div class="main-buttons">
        <button class="btn-main trufi" onclick="showScreen('lineasScreen')"><i class="fas fa-bus"></i> TRUFI</button>
        <button class="btn-main micro" onclick="showScreen('microsScreen')"><i class="fas fa-shuttle-van"></i> MICRO</button>
    </div>
</div>

<!-- PANTALLA DE LÍNEAS -->
<div id="lineasScreen" class="screen">
    <div class="header">
        <button class="back-btn" onclick="showScreen('mainScreen')"><i class="fas fa-arrow-left"></i></button>
        <h1><i class="fas fa-bars" style="margin-right:8px;"></i>Líneas</h1>
        <div style="width:36px;"></div>
    </div>
    <div class="content">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchLineas" placeholder="Buscar línea..." oninput="filtrarLineas()">
        </div>
        <div class="list-container" id="lineasList"></div>
    </div>
</div>

<!-- PANTALLA DE MICROS -->
<div id="microsScreen" class="screen">
    <div class="header micro-header">
        <button class="back-btn" onclick="showScreen('mainScreen')"><i class="fas fa-arrow-left"></i></button>
        <h1><i class="fas fa-bus" style="margin-right:8px;"></i>Micros</h1>
        <div style="width:36px;"></div>
    </div>
    <div class="content">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchMicros" placeholder="Buscar micro..." oninput="filtrarMicros()">
        </div>
        <div class="list-container" id="microsList"></div>
    </div>
</div>

<!-- PANTALLA DE DETALLE (LÍNEAS) -->
<div id="detalleScreen" class="screen">
    <div class="header">
        <button class="back-btn" onclick="cerrarDetalle()"><i class="fas fa-arrow-left"></i></button>
        <h1 id="detalleTitulo">Línea</h1>
        <div style="width:36px;"></div>
    </div>
    <div class="content">
        <div id="mapContainer">
            <div id="map"></div>
            <button id="btnUbicarmeLinea" class="btn-ubicarme btn-ubicarme-detail" onclick="ubicarmeLinea()"><i class="fas fa-crosshairs"></i></button>
        </div>

        <div class="cruzero-nav-bar" id="bottomPanel">
            <button class="nav-btn" onclick="mostrarDatos()"><i class="fas fa-clipboard-list"></i></button>
            <button class="nav-btn" onclick="mostrarVuelta()"><i class="fas fa-sync-alt" id="iconoVuelta"></i></button>
            <button class="nav-btn" onclick="mostrarRecorrido()"><i class="fas fa-map-marked-alt"></i></button>
        </div>
        <div id="infoContainer" style="display:none;"></div>
    </div>
</div>

<!-- PANTALLA DE DATOS -->
<div id="datosScreen" class="screen">
    <div class="header">
        <button class="back-btn" onclick="cerrarDatos()"><i class="fas fa-arrow-left"></i></button>
        <h1 id="datosTituloHeader">Datos</h1>
        <div style="width:36px;"></div>
    </div>
    <div class="content data-content">
        <div id="datosContent"></div>
    </div>
</div>

<!-- PANTALLA DE RECORRIDO -->
<div id="recorridoScreen" class="screen">
    <div class="header">
        <button class="back-btn" onclick="cerrarRecorrido()"><i class="fas fa-arrow-left"></i></button>
        <h1 id="recorridoTituloHeader">Recorrido</h1>
        <div style="width:36px;"></div>
    </div>
    <div class="content data-content">
        <div id="recorridoContent"></div>
    </div>
</div>

<!-- PANTALLA DE DETALLE (MICROS) -->
<div id="detalleMicroScreen" class="screen">
    <div class="header micro-header">
        <button class="back-btn" onclick="cerrarDetalleMicro()"><i class="fas fa-arrow-left"></i></button>
        <h1 id="detalleMicroTitulo">Micro</h1>
        <div style="width:36px;"></div>
    </div>
    <div class="content">
        <div id="mapContainerMicro">
            <div id="mapMicro"></div>
            <button id="btnUbicarmeMicro" class="btn-ubicarme btn-ubicarme-detail" onclick="ubicarmeMicro()"><i class="fas fa-crosshairs"></i></button>
        </div>
        
        <div class="cruzero-nav-bar" id="bottomPanelMicro">
            <button class="nav-btn" onclick="mostrarDatosMicro()"><i class="fas fa-clipboard-list"></i></button>
            <button class="nav-btn" onclick="mostrarVueltaMicro()"><i class="fas fa-sync-alt" id="iconoVueltaMicro"></i></button>
            <button class="nav-btn" onclick="mostrarRecorridoMicro()"><i class="fas fa-map-marked-alt"></i></button>
        </div>
        <div id="infoContainerMicro" style="display:none;"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
